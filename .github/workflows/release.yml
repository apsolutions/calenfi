name: Release

# Собирает бинарники под все 4 платформы на нативных раннерах GitHub и
# прикладывает их к GitHub Release. Триггер — тег vMAJOR.MINOR.PATCH (SemVer).
# Токен не нужен: используется встроенный GITHUB_TOKEN.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.44.1
  # OAuth-клиенты приложения зашиваются в сборку (tools/oauth_dart_defines.sh →
  # --dart-define). Без них скачанная сборка не может начать вход через браузер.
  # Только идентификаторы OAuth-приложений, не токены и не пароли пользователей.
  GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
  GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
  GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
  GRAPH_TENANT: ${{ secrets.GRAPH_TENANT }}
  YANDEX_OAUTH_CLIENT_ID: ${{ secrets.YANDEX_OAUTH_CLIENT_ID }}
  YANDEX_OAUTH_CLIENT_SECRET: ${{ secrets.YANDEX_OAUTH_CLIENT_SECRET }}

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify application identity
        run: bash tools/verify_application_identity.sh
      # Падаем до четырёх сборок, а не публикуем релиз, в котором вход не работает.
      - name: Verify OAuth clients are configured
        run: bash tools/oauth_dart_defines.sh --require > /dev/null

  # ─────────────────────────── Linux ────────────────────────────
  linux:
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          # libsecret-1-dev + libjsoncpp-dev нужны flutter_secure_storage_linux
          # (нативный плагин keyring), иначе `flutter build linux` падает на CMake.
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build
        run: |
          bash tools/oauth_dart_defines.sh --require > "$RUNNER_TEMP/oauth-defines"
          defines=(); while IFS= read -r d; do defines+=("$d"); done < "$RUNNER_TEMP/oauth-defines"
          flutter build linux --release "${defines[@]}"
      - name: Verify OAuth clients are embedded
        run: |
          so=build/linux/x64/release/bundle/lib/libapp.so
          grep -aFq "$GOOGLE_OAUTH_CLIENT_ID" "$so"
          grep -aFq "$GRAPH_CLIENT_ID" "$so"
      - name: Package
        run: |
          cd build/linux/x64/release/bundle
          tar czf "$GITHUB_WORKSPACE/calenfi-${GITHUB_REF_NAME}-linux-x64.tar.gz" .
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: calenfi-*-linux-x64.tar.gz }

  # ────────────────────────── Windows ───────────────────────────
  windows:
    needs: identity
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Build
        shell: bash
        run: |
          bash tools/oauth_dart_defines.sh --require > "$RUNNER_TEMP/oauth-defines"
          defines=(); while IFS= read -r d; do defines+=("$d"); done < "$RUNNER_TEMP/oauth-defines"
          flutter build windows --release "${defines[@]}"
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath "calenfi-${env:GITHUB_REF_NAME}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: calenfi-*-windows-x64.zip }

  # ─────────────────────────── macOS ────────────────────────────
  macos:
    needs: identity
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      # macos/ нет в репо (Flutter генерит её только на Mac) — создаём скриптом:
      # он же патчит entitlements (сеть, Keychain, sandbox off) под нашу схему.
      - run: bash tools/setup_macos.sh
      - name: Build
        run: |
          bash tools/oauth_dart_defines.sh --require > "$RUNNER_TEMP/oauth-defines"
          defines=(); while IFS= read -r d; do defines+=("$d"); done < "$RUNNER_TEMP/oauth-defines"
          flutter build macos --release "${defines[@]}"
      - name: Verify macOS bundle identity
        run: |
          app=build/macos/Build/Products/Release/calenfi.app
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            "$app/Contents/Info.plist")"
          test "$actual" = 'ru.apsolutions.calenfi'
          # Виджеты «сегодня» и мини-календарь встраиваются в бандл отдельным
          # таргетом (tools/macos_add_widget_target.rb) — без .appex релиз неполон.
          appex="$app/Contents/PlugIns/CalenfiWidgets.appex"
          test -d "$appex"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' \
            "$appex/Contents/Info.plist")" = 'ru.apsolutions.calenfi.widgets'
      - name: Package
        run: |
          cd build/macos/Build/Products/Release
          zip -ry "$GITHUB_WORKSPACE/calenfi-${GITHUB_REF_NAME}-macos.zip" calenfi.app
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: calenfi-*-macos.zip }

  # ────────────────────────── Android ───────────────────────────
  android:
    needs: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      # split-per-abi: отдельный APK на каждую архитектуру (меньше размер).
      # Подпись — debug-ключом (для release-подписи добавьте keystore в secrets).
      - name: Build
        run: |
          bash tools/oauth_dart_defines.sh --require > "$RUNNER_TEMP/oauth-defines"
          defines=(); while IFS= read -r d; do defines+=("$d"); done < "$RUNNER_TEMP/oauth-defines"
          flutter build apk --release --split-per-abi "${defines[@]}"
      - name: Verify release identity, network permission and OAuth clients
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -1)"
          test -n "$AAPT"
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            badging="$("$AAPT" dump badging "$apk")"
            permissions="$("$AAPT" dump permissions "$apk")"
            grep -Fq "package: name='ru.apsolutions.calenfi'" <<<"$badging"
            grep -Fq "name='android.permission.INTERNET'" <<<"$permissions"
            # Без зашитого OAuth-клиента вход через браузер в APK не стартует.
            unzip -p "$apk" 'lib/*/libapp.so' > "$RUNNER_TEMP/libapp.so"
            grep -aFq "$GOOGLE_OAUTH_CLIENT_ID" "$RUNNER_TEMP/libapp.so"
            grep -aFq "$GRAPH_CLIENT_ID" "$RUNNER_TEMP/libapp.so"
          done
      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            abi="${f#app-}"; abi="${abi%-release.apk}"
            cp "$f" "$GITHUB_WORKSPACE/calenfi-${GITHUB_REF_NAME}-${abi}.apk"
          done
      - uses: actions/upload-artifact@v4
        with: { name: android, path: calenfi-*.apk }

  # ─────────────────── публикация GitHub Release ─────────────────
  release:
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
